<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Sistema - EduGest PME</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🔧 Reset Sistema</h1>
                <p>Herramienta de Diagnóstico</p>
            </div>

            <div style="padding: 20px;">
                <h3>Estado del Sistema</h3>
                <div id="status" style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 15px 0; font-family: monospace; font-size: 12px;"></div>

                <h3>Usuarios Disponibles</h3>
                <div id="usuarios" style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 15px 0; font-family: monospace; font-size: 12px;"></div>

                <button onclick="resetearSistema()" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                    🔄 Resetear Sistema y Cargar Datos Demo
                </button>

                <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
                    ← Volver al Login
                </button>
            </div>
        </div>
    </div>

    <script>
        function mostrarEstado() {
            const colegios = JSON.parse(localStorage.getItem('colegios') || '{}');
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '{}');
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <strong>Colegios registrados:</strong> ${Object.keys(colegios).length}<br>
                <strong>Usuarios registrados:</strong> ${Object.keys(usuarios).length}<br>
                <strong>Eventos:</strong> ${JSON.parse(localStorage.getItem('demoEventos') || '[]').length}<br>
                <strong>Gastos:</strong> ${JSON.parse(localStorage.getItem('demoGastos') || '[]').length}
            `;

            const usuariosDiv = document.getElementById('usuarios');
            if (Object.keys(usuarios).length > 0) {
                let html = '<strong>Lista de usuarios:</strong><br><br>';
                Object.values(usuarios).forEach(u => {
                    html += `📧 ${u.email}<br>`;
                    html += `   🔑 ${u.password}<br>`;
                    html += `   👤 ${u.nombre} (${u.rol})<br>`;
                    html += `   💰 Finanzas: ${u.permisoFinanzas ? 'Sí' : 'No'}<br><br>`;
                });
                usuariosDiv.innerHTML = html;
            } else {
                usuariosDiv.innerHTML = '<em>No hay usuarios registrados</em>';
            }
        }

        function resetearSistema() {

                };
                
                // Crear usuarios demo
                const usuarios = {
                    'director@mistral.cl': {

                    },

                    },
                    'utp@mistral.cl': {

                    },
                    'director@neruda.cl': {

                    },

                    }
                };
                
                localStorage.setItem('colegios', JSON.stringify(colegios));
                localStorage.setItem('usuarios', JSON.stringify(usuarios));
                
                alert('✅ Sistema reseteado exitosamente!\n\nPuedes usar cualquiera de estas cuentas:\n\n' +
                      'director@mistral.cl / Director2026\n' +
                      'docente@mistral.cl / Docente2026\n' +

        // Mostrar estado al cargar
        mostrarEstado();
    </script>
</body>
