<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Colegio - EDUGEST</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🏫</div>
                <h1>Registrar Nuevo Colegio</h1>
                <p>Crea un espacio independiente para tu institución</p>
            </div>

            <form id="registroColegioForm">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <div class="form-group">
                    <label>Nombre del Colegio</label>
                    <input type="text" id="nombreColegio" required placeholder="Ej: Colegio San José">
                </div>

                <div class="form-group">
                    <label>RBD (Opcional)</label>
                    <input type="text" id="rbd" placeholder="Ej: 12345-6">
                    <small>Rol Base de Datos del establecimiento</small>
                </div>

                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" required placeholder="Ej: Av. Principal 123">
                </div>

                <div class="form-group">
                    <label>Comuna</label>
                    <input type="text" id="comuna" required placeholder="Ej: Santiago">
                </div>

                <div class="form-group">
                    <label>Región</label>
                    <select id="region" required>
                        <option value="">Seleccionar región...</option>
                        <option value="Región Metropolitana">Región Metropolitana</option>
                        <option value="Región de Valparaíso">Región de Valparaíso</option>
                        <option value="Región del Biobío">Región del Biobío</option>
                        <option value="Región de La Araucanía">Región de La Araucanía</option>
                        <option value="Región de Los Lagos">Región de Los Lagos</option>
                        <option value="Región de Antofagasta">Región de Antofagasta</option>
                        <option value="Región de Coquimbo">Región de Coquimbo</option>
                        <option value="Región de O'Higgins">Región de O'Higgins</option>
                        <option value="Región del Maule">Región del Maule</option>
                        <option value="Región de Ñuble">Región de Ñuble</option>
                        <option value="Región de Los Ríos">Región de Los Ríos</option>
                        <option value="Región de Aysén">Región de Aysén</option>
                        <option value="Región de Magallanes">Región de Magallanes</option>
                        <option value="Región de Arica y Parinacota">Región de Arica y Parinacota</option>
                        <option value="Región de Tarapacá">Región de Tarapacá</option>
                        <option value="Región de Atacama">Región de Atacama</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="telefono" placeholder="Ej: +56 9 1234 5678">
                </div>

                <div class="form-group">
                    <label>Email del Colegio</label>
                    <input type="email" id="emailColegio" required placeholder="Ej: contacto@colegio.cl">
                </div>

                <h3 style="margin: var(--space-xl) 0 var(--space-lg) 0; font-size: 18px; font-weight: 800; color: var(--gray-800); border-top: 2px solid var(--gray-200); padding-top: var(--space-xl);">
                    👨‍💼 Datos del Director/Administrador
                </h3>

                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombreDirector" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailDirector" required placeholder="Ej: director@colegio.cl">
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Repite la contraseña">
                </div>

                <button type="submit" class="btn btn-primary">🚀 Crear Colegio</button>
                
                <div style="text-align: center; margin-top: 16px;">
                    <a href="seleccionar-colegio.html" style="color: #3b82f6; text-decoration: none; font-weight: 600;">
                        ← Volver a selección de colegios
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/multi-colegio.js"></script>
    <script>
        document.getElementById('registroColegioForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('errorMessage');
            
            // Validar contraseñas
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Las contraseñas no coinciden';
                errorDiv.style.display = 'block';
                return;
            }

            // Crear objeto del colegio
            const colegio = {
                id: 'colegio_' + Date.now(),
                nombre: document.getElementById('nombreColegio').value,
                rbd: document.getElementById('rbd').value,
                direccion: document.getElementById('direccion').value,
                comuna: document.getElementById('comuna').value,
                region: document.getElementById('region').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('emailColegio').value,
                fechaCreacion: new Date().toISOString(),
                usuarios: 1
            };

            // Crear usuario director
            const director = {
                id: 'user_' + Date.now(),
                nombre: document.getElementById('nombreDirector').value,
                email: document.getElementById('emailDirector').value,
                password: password, // En producción, esto debe estar hasheado
                role: 'director',
                colegioId: colegio.id,
                fechaCreacion: new Date().toISOString()
            };

            // Registrar colegio
            if (registrarColegio(colegio, director)) {
                alert('✅ Colegio registrado exitosamente!\n\nYa puedes iniciar sesión con tus credenciales.');
                window.location.href = 'seleccionar-colegio.html';
            } else {
                errorDiv.textContent = 'Error al registrar el colegio. Intenta nuevamente.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
