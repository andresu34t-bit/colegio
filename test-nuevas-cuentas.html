<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Nuevas Cuentas de Colegios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .colegio-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .colegio-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .colegio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .colegio-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        
        .colegio-id {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .cuenta-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .cuenta {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .cuenta-tipo {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .credencial {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }
        
        .credencial-label {
            font-weight: bold;
            color: #666;
            width: 80px;
        }
        
        .credencial-value {
            color: #333;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 5px;
            flex: 1;
        }
        
        .btn-test {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-test:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏫 Test de Nuevas Cuentas</h1>
        <p class="subtitle">10 colegios completamente diferentes agregados al sistema</p>
        
        <div class="success-message" id="successMessage">
            ✅ ¡Todas las cuentas están activas y listas para usar!
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">10</div>
                <div class="stat-label">Colegios Nuevos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">20</div>
                <div class="stat-label">Cuentas Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">100%</div>
                <div class="stat-label">Datos Únicos</div>
            </div>
        </div>
        
        <div id="colegiosContainer"></div>
    </div>
    
    <script src="js/login-modern.js"></script>
    <script>
        // Datos de los nuevos colegios
        const nuevosColegios = [
            {
                nombre: 'Instituto Técnico Industrial',
                id: 'colegio-003',
                ubicacion: 'Recoleta',
                director: { email: 'director.tecnico@edugest.cl', password: 'industrial2026', nombre: 'Rodrigo Fuentes' },
                docente: { email: 'profesor.mecanica@edugest.cl', password: 'mecanica789', nombre: 'Alberto Méndez' }
            },
            {
                nombre: 'Liceo Bicentenario de Excelencia',
                id: 'colegio-004',
                ubicacion: 'La Florida',
                director: { email: 'director.bicentenario@edugest.cl', password: 'excel2026', nombre: 'Claudia Morales' },
                docente: { email: 'profe.ciencias@edugest.cl', password: 'ciencias555', nombre: 'Sebastián Vega' }
            },
            {
                nombre: 'Colegio Montessori del Valle',
                id: 'colegio-005',
                ubicacion: 'Vitacura',
                director: { email: 'coordinador.montessori@edugest.cl', password: 'montessori321', nombre: 'Francisca Bravo' },
                docente: { email: 'guia.primaria@edugest.cl', password: 'guia2026', nombre: 'Camila Espinoza' }
            },
            {
                nombre: 'Escuela Rural Valle Verde',
                id: 'colegio-006',
                ubicacion: 'Colina',
                director: { email: 'director.valleverde@edugest.cl', password: 'rural2026', nombre: 'Marcelo Campos' },
                docente: { email: 'maestro.multigrado@edugest.cl', password: 'rural123', nombre: 'Rosa Navarro' }
            },
            {
                nombre: 'Colegio Bilingüe Internacional',
                id: 'colegio-007',
                ubicacion: 'Lo Barnechea',
                director: { email: 'principal.bilingual@edugest.cl', password: 'bilingual999', nombre: 'Katherine Wilson' },
                docente: { email: 'teacher.english@edugest.cl', password: 'english2026', nombre: 'Michael Anderson' }
            },
            {
                nombre: 'Liceo Artístico Gabriela Mistral',
                id: 'colegio-008',
                ubicacion: 'Estación Central',
                director: { email: 'director.artistico@edugest.cl', password: 'arte2026', nombre: 'Gabriela Reyes' },
                docente: { email: 'maestro.musica@edugest.cl', password: 'musica444', nombre: 'Andrés Parra' }
            },
            {
                nombre: 'Colegio Deportivo Alto Rendimiento',
                id: 'colegio-009',
                ubicacion: 'Peñalolén',
                director: { email: 'director.deportivo@edugest.cl', password: 'deporte2026', nombre: 'Cristian Medina' },
                docente: { email: 'coach.futbol@edugest.cl', password: 'futbol777', nombre: 'Javier Contreras' }
            },
            {
                nombre: 'Instituto Waldorf Raíces del Sur',
                id: 'colegio-010',
                ubicacion: 'La Reina',
                director: { email: 'coordinador.waldorf@edugest.cl', password: 'waldorf2026', nombre: 'Sofía Larraín' },
                docente: { email: 'maestro.waldorf@edugest.cl', password: 'steiner888', nombre: 'Tomás Becker' }
            },
            {
                nombre: 'Colegio Científico Innovación',
                id: 'colegio-011',
                ubicacion: 'Macul',
                director: { email: 'director.cientifico@edugest.cl', password: 'innovacion2026', nombre: 'Patricia Núñez' },
                docente: { email: 'profesor.robotica@edugest.cl', password: 'stem2026', nombre: 'Diego Salazar' }
            },
            {
                nombre: 'Escuela Básica Amanecer',
                id: 'colegio-012',
                ubicacion: 'Puente Alto',
                director: { email: 'director.amanecer@edugest.cl', password: 'amanecer2026', nombre: 'Lorena Gutiérrez' },
                docente: { email: 'educadora.pie@edugest.cl', password: 'inclusion2026', nombre: 'Paulina Ortiz' }
            }
        ];
        
        // Renderizar colegios
        const container = document.getElementById('colegiosContainer');
        
        nuevosColegios.forEach((colegio, index) => {
            const card = document.createElement('div');
            card.className = 'colegio-card';
            card.innerHTML = `
                <div class="colegio-header">
                    <div class="colegio-name">${index + 1}. ${colegio.nombre}</div>
                    <div class="colegio-id">${colegio.id}</div>
                </div>
                <div style="color: #666; margin-bottom: 15px;">📍 ${colegio.ubicacion}</div>
                
                <div class="cuenta-info">
                    <div class="cuenta">
                        <div class="cuenta-tipo">👔 Director</div>
                        <div class="credencial">
                            <span class="credencial-label">Email:</span>
                            <span class="credencial-value">${colegio.director.email}</span>
                        </div>
                        <div class="credencial">
                            <span class="credencial-label">Password:</span>
                            <span class="credencial-value">${colegio.director.password}</span>
                        </div>
                        <div style="margin-top: 10px; color: #666;">👤 ${colegio.director.nombre}</div>
                        <button class="btn-test" onclick="testLogin('${colegio.director.email}', '${colegio.director.password}')">
                            Probar Login Director
                        </button>
                    </div>
                    
                    <div class="cuenta">
                        <div class="cuenta-tipo">👨‍🏫 Docente</div>
                        <div class="credencial">
                            <span class="credencial-label">Email:</span>
                            <span class="credencial-value">${colegio.docente.email}</span>
                        </div>
                        <div class="credencial">
                            <span class="credencial-label">Password:</span>
                            <span class="credencial-value">${colegio.docente.password}</span>
                        </div>
                        <div style="margin-top: 10px; color: #666;">👤 ${colegio.docente.nombre}</div>
                        <button class="btn-test" onclick="testLogin('${colegio.docente.email}', '${colegio.docente.password}')">
                            Probar Login Docente
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
        
        // Mostrar mensaje de éxito
        document.getElementById('successMessage').style.display = 'block';
        
        // Función para probar login
        function testLogin(email, password) {
            if (typeof DEMO_USERS !== 'undefined' && DEMO_USERS[email]) {
                const user = DEMO_USERS[email];
                if (user.password === password) {
                    alert(`✅ Login exitoso!\n\nUsuario: ${user.name}\nRol: ${user.role}\nColegio: ${user.school}\nID: ${user.schoolId}\n\nLa cuenta está funcionando correctamente.`);
                    
                    // Opcional: redirigir al login real
                    if (confirm('¿Deseas ir a la página de login para ingresar con esta cuenta?')) {
                        window.location.href = 'login.html';
                    }
                } else {
                    alert('❌ Error: Contraseña incorrecta');
                }
            } else {
                alert('❌ Error: Usuario no encontrado en la base de datos');
            }
        }
        
        console.log('✅ Test de nuevas cuentas cargado');
        console.log('📊 Total de colegios nuevos:', nuevosColegios.length);
        console.log('📊 Total de cuentas nuevas:', nuevosColegios.length * 2);
    </script>
</body>
</html>
