<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - andmien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }
        
        .info-box {
            background: #f3f4f6;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
        }
        
        .info-box h3 {
            color: #1f2937;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .info-box p {
            color: #4b5563;
            font-size: 0.875rem;
            margin: 0.25rem 0;
        }
        
        .info-box code {
            background: white;
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            color: #dc2626;
        }
        
        .btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.75rem;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: #22c55e;
            color: white;
        }
        
        .btn-success:hover {
            background: #16a34a;
        }
        
        .status {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        .status-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
        
        .status-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        
        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .session-data {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #374151;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Login - andmien</h1>
        <p class="subtitle">Herramienta de prueba para verificar el login del usuario andmien</p>
        
        <div class="info-box">
            <h3>📋 Credenciales de Prueba</h3>
            <p><strong>Usuario:</strong> <code>andmien</code></p>
            <p><strong>Contraseña:</strong> <code>admin123</code></p>
            <p><strong>Rol:</strong> <code>admin_global</code></p>
        </div>
        
        <button class="btn btn-primary" onclick="loginAndmien()">
            🚀 Login como andmien
        </button>
        
        <button class="btn btn-secondary" onclick="checkSession()">
            🔍 Verificar Sesión Actual
        </button>
        
        <button class="btn btn-danger" onclick="clearSession()">
            🗑️ Limpiar Sesión
        </button>
        
        <button class="btn btn-success" onclick="goToAdminPanel()">
            🏠 Ir al Panel Admin
        </button>
        
        <div id="status"></div>
        <div id="sessionData"></div>
    </div>
    
    <script>
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status status-${type}`;
            statusDiv.textContent = message;
        }
        
        function showSessionData(data) {
            const sessionDiv = document.getElementById('sessionData');
            sessionDiv.className = 'session-data';
            sessionDiv.textContent = JSON.stringify(data, null, 2);
        }
        
        function loginAndmien() {
            showStatus('Creando sesión para andmien...', 'info');
            
            const sessionData = {
                email: 'andmien',
                role: 'admin_global',
                name: 'Administrador Global',
                school: 'Sistema EDUGEST',
                schoolId: null,
                loginTime: new Date().toISOString()
            };
            
            // Guardar en localStorage
            localStorage.setItem('edugest_session', JSON.stringify(sessionData));
            
            showStatus('✅ Sesión creada exitosamente. Redirigiendo en 2 segundos...', 'success');
            showSessionData(sessionData);
            
            setTimeout(() => {
                window.location.replace('admin-global.html');
            }, 2000);
        }
        
        function checkSession() {
            const session = localStorage.getItem('edugest_session') || 
                           sessionStorage.getItem('edugest_session');
            
            if (!session) {
                showStatus('❌ No hay sesión activa', 'error');
                document.getElementById('sessionData').textContent = '';
                return;
            }
            
            try {
                const data = JSON.parse(session);
                showStatus('✅ Sesión encontrada', 'success');
                showSessionData(data);
            } catch (e) {
                showStatus('❌ Error: Sesión corrupta', 'error');
                document.getElementById('sessionData').textContent = '';
            }
        }
        
        function clearSession() {
            localStorage.removeItem('edugest_session');
            sessionStorage.removeItem('edugest_session');
            showStatus('✅ Sesión limpiada correctamente', 'success');
            document.getElementById('sessionData').textContent = '';
        }
        
        function goToAdminPanel() {
            const session = localStorage.getItem('edugest_session') || 
                           sessionStorage.getItem('edugest_session');
            
            if (!session) {
                showStatus('❌ No hay sesión activa. Haz login primero.', 'error');
                return;
            }
            
            window.location.href = 'admin-global.html';
        }
        
        // Verificar sesión al cargar
        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });
    </script>
</body>
</html>
