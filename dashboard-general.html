<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard General - EDUGEST</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/sidebar-professional.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ── HERO BANNER ── */
        .dash-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            border-radius: var(--radius-xl);
            padding: 2rem 2.5rem;
            color: white;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .dash-hero-text h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.375rem 0;
            font-family: var(--font-display);
        }
        .dash-hero-text p { font-size: 0.9rem; opacity: 0.8; margin: 0; }
        .dash-hero-stats {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .dash-hero-stat {
            text-align: center;
        }
        .dash-hero-stat .val {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
        }
        .dash-hero-stat .lbl {
            font-size: 0.72rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* ── MODULE CARDS ── */
        .modules-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .mod-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .mod-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .mod-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
        }
        .mod-card.pme::before { background: linear-gradient(90deg, #3b82f6, #6366f1); }
        .mod-card.obs::before { background: linear-gradient(90deg, #a855f7, #ec4899); }
        .mod-card.cob::before { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .mod-card.pie::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }

        .mod-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }
        .mod-card-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .mod-card-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.25rem 0.625rem;
            border-radius: var(--radius-full);
        }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-coming { background: #f3f4f6; color: #6b7280; }
        .badge-progress { background: #fef9c3; color: #a16207; }

        .mod-card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--gray-900);
            margin: 0 0 0.25rem 0;
        }
        .mod-card-sub {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin: 0 0 1.25rem 0;
        }

        /* Progress ring */
        .progress-ring-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .ring-svg { transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: var(--gray-100); stroke-width: 6; }
        .ring-fill { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1.2s ease; }
        .ring-label {
            display: flex;
            flex-direction: column;
        }
        .ring-pct {
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1;
        }
        .ring-desc {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 0.2rem;
        }

        .mod-mini-stats {
            display: flex;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--gray-100);
        }
        .mod-mini-stat {
            flex: 1;
            text-align: center;
        }
        .mod-mini-stat .v {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gray-800);
        }
        .mod-mini-stat .l {
            font-size: 0.72rem;
            color: var(--gray-500);
            margin-top: 0.15rem;
        }

        /* Coming soon overlay */
        .coming-soon-overlay {
            position: absolute;
            inset: 0;
            background: rgba(249,250,251,0.88);
            backdrop-filter: blur(2px);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            z-index: 2;
        }
        .coming-soon-overlay .cs-icon { font-size: 2rem; }
        .coming-soon-overlay .cs-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gray-600);
        }
        .coming-soon-overlay .cs-sub {
            font-size: 0.78rem;
            color: var(--gray-400);
        }

        /* ── CHARTS ROW ── */
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 900px) {
            .charts-row { grid-template-columns: 1fr; }
        }

        /* ── ALERTS / ACTIVIDAD ── */
        .activity-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 0.875rem;
            padding: 0.875rem;
            background: var(--gray-50);
            border-radius: var(--radius-lg);
        }
        .activity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 0.35rem;
            flex-shrink: 0;
        }
        .activity-text { flex: 1; }
        .activity-title { font-size: 0.85rem; font-weight: 600; color: var(--gray-800); }
        .activity-time { font-size: 0.75rem; color: var(--gray-400); margin-top: 0.15rem; }

        /* ── QUICK ACTIONS ── */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .qa-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1.25rem 1rem;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--gray-700);
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
        }
        .qa-btn:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .qa-btn .qa-icon { font-size: 1.5rem; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .dash-hero { padding: 1.25rem; }
            .dash-hero-text h2 { font-size: 1.2rem; }
            .dash-hero-stats { gap: 1rem; }
            .dash-hero-stat .val { font-size: 1.5rem; }
            .modules-overview { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
