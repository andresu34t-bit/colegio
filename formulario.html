<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Evento - EduGest PME</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo-container">
                <img src="images/logo-edugest.png" alt="Logo EduGest PME" class="sidebar-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <span class="sidebar-logo-emoji" style="display: none;">📚</span>
            </div>
            <h2>EduGest PME</h2>
        </div>
        
        <div class="user-info">
            <div class="user-avatar">D</div>
            <p class="user-name" id="userName">Usuario</p>
            <p class="user-role" id="userRole">Rol</p>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
            <a href="formulario.html" class="nav-item active">📝 Registrar Evento</a>
            <a href="informes.html" class="nav-item">📄 Informes</a>
            <a href="finanzas.html" class="nav-item" id="navFinanzas" style="display: none;">💰 Finanzas</a>
        </nav>

        <button class="logout-btn" id="logoutBtn">🚪 Cerrar Sesión</button>
    </div>

    <div class="main-content">
        <div class="dashboard-header" style="margin-bottom: var(--space-2xl);">
            <div>
                <h1 style="font-size: 36px; margin-bottom: var(--space-sm);">📝 Registrar Evento PME</h1>
                <p style="color: var(--gray-600); font-size: 16px; font-weight: 600;">Ingresa los datos exactamente como en tu Excel</p>
            </div>
        </div>

        <div class="form-card">
            <form id="eventoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>📅 Día</label>
                        <input type="number" id="dia" min="1" max="31" required placeholder="Ej: 15">
                    </div>

                    <div class="form-group">
                        <label>📆 Mes</label>
                        <select id="mes" required>
                            <option value="">Seleccionar mes...</option>
                            <option value="ENERO">Enero</option>
                            <option value="FEBRERO">Febrero</option>
                            <option value="MARZO">Marzo</option>
                            <option value="ABRIL">Abril</option>
                            <option value="MAYO">Mayo</option>
                            <option value="JUNIO">Junio</option>
                            <option value="JULIO">Julio</option>
                            <option value="AGOSTO">Agosto</option>
                            <option value="SEPTIEMBRE">Septiembre</option>
                            <option value="OCTUBRE">Octubre</option>
                            <option value="NOVIEMBRE">Noviembre</option>
                            <option value="DICIEMBRE">Diciembre</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🎯 Área</label>
                        <select id="area" required>
                            <option value="">Seleccionar área...</option>
                            <option value="Currículum">📚 Currículum</option>
                            <option value="Liderazgo">👔 Liderazgo</option>
                            <option value="Convivencia">🤝 Convivencia Escolar</option>
                            <option value="Recursos">💼 Recursos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>✏️ Acción</label>
                        <input type="text" id="accion" required placeholder="Ej: Talleres de lectura, Reuniones...">
                        <small>Describe la acción o actividad realizada</small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🔢 N° Eventos</label>
                        <input type="number" id="n_eventos" min="0" required placeholder="0">
                    </div>

                    <div class="form-group">
                        <label>📊 % Éxito Objetivo</label>
                        <input type="number" id="exito_objetivo" min="0" max="100" required placeholder="0-100">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>🎯 Meta</label>
                        <input type="number" id="meta" min="0" required placeholder="0">
                    </div>

                    <div class="form-group">
                        <label>📈 % Éxito Meta</label>
                        <input type="number" id="exito_meta" min="0" max="100" required placeholder="0-100">
                    </div>
                </div>

                <div class="form-group">
                    <label>👨‍🏫 Docente Responsable</label>
                    <input type="text" id="docente" required placeholder="Nombre completo del docente">
                </div>

                <div class="form-group">
                    <label class="optional">📝 Descripción</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe los detalles del evento o actividad..."></textarea>
                    <small>Opcional: Agrega información adicional sobre el evento</small>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                        ← Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        💾 Guardar Evento
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/mobile-menu.js"></script>
    <script src="js/formulario-demo.js"></script>
</body>
</html>
