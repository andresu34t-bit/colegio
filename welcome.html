<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - EduGest</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: var(--space-lg);
            position: relative;
            overflow: hidden;
        }

        .welcome-page::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(30px);
            padding: var(--space-2xl);
            border-radius: var(--radius-2xl);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: slideInUp 0.6s ease-out;
            text-align: center;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-2xl);
            letter-spacing: -1px;
        }

        .welcome-title-editable {
            font-size: 42px;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: var(--space-xl);
            padding: var(--space-md);
            border: 3px dashed transparent;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            cursor: text;
        }

        .welcome-title-editable:hover {
            border-color: var(--primary-300);
            background: var(--gray-50);
        }

        .welcome-title-editable:focus {
            outline: none;
            border-color: var(--primary-600);
            background: white;
        }

        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-2xl);
            margin: var(--space-2xl) 0;
            flex-wrap: wrap;
        }

        .logo-box {
            width: 180px;
            height: 180px;
            border: 3px solid var(--gray-200);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all var(--transition-base);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .logo-box:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-600);
        }

        .logo-box img {
            max-width: 140px;
            max-height: 140px;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 64px;
            color: var(--gray-300);
            margin-bottom: var(--space-sm);
        }

        .logo-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: var(--space-sm);
        }

        .logo-upload-hint {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: var(--space-xs);
        }

        .welcome-btn {
            margin-top: var(--space-2xl);
            padding: 24px 64px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--gray-600);
            margin-top: var(--space-lg);
            font-weight: 500;
        }
    </style>
</head>
<body class="welcome-page">
    <div class="welcome-container">
        <div class="logos-container" style="margin-bottom: var(--space-xl);">
            <div class="logo-box" style="border: none; box-shadow: none; cursor: default;">
                <div class="logo-placeholder" style="font-size: 120px;">📚</div>
            </div>
        </div>

        <h1 class="welcome-title">EDUGEST</h1>
        
        <h2 class="welcome-title-editable" id="schoolName" style="cursor: default; border: none;">
            Cargando...
        </h2>

        <button class="welcome-btn" onclick="ingresarSistema()">
            🚀 Ingresar al Sistema
        </button>

        <p class="welcome-subtitle">
            Sistema de Gestión Educativa Integral
        </p>
    </div>

    <script>
        // Cargar nombre del colegio desde la sesión
        window.addEventListener('DOMContentLoaded', () => {
            const demoUser = localStorage.getItem('demoUser');
            if (demoUser) {
                const user = JSON.parse(demoUser);
                const schoolNameEl = document.getElementById('schoolName');
                schoolNameEl.textContent = user.colegioNombre || 'Sistema EduGest';
            } else {
                // Si no hay sesión, redirigir al login
                window.location.href = 'index.html';
            }
        });

        // Función para ingresar al sistema
        function ingresarSistema() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
