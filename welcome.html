<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - EDUGEST</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: var(--space-lg);
            position: relative;
            overflow: hidden;
        }

        .welcome-page::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(40px);
            padding: var(--space-2xl);
            border-radius: var(--radius-2xl);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--gray-900);
            margin-bottom: var(--space-lg);
            line-height: 1.2;
        }

        .welcome-title-editable {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-2xl);
            margin: var(--space-2xl) 0;
            flex-wrap: wrap;
        }

        .logo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-md);
        }

        .logo-box {
            width: 180px;
            height: 180px;
            border-radius: var(--radius-xl);
            background: white;
            border: 3px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            overflow: hidden;
        }

        .logo-box:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-600);
        }

        .logo-box img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 64px;
            color: var(--gray-400);
        }

        .logo-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .welcome-btn {
            margin-top: var(--space-2xl);
            padding: 24px 48px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.35);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .welcome-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 16px 48px rgba(99, 102, 241, 0.45);
        }

        .welcome-subtitle {
            font-size: 18px;
            color: var(--gray-600);
            margin-top: var(--space-lg);
            font-weight: 600;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -30px) rotate(180deg); }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: 32px;
            }

            .logos-container {
                gap: var(--space-lg);
            }

            .logo-box {
                width: 120px;
                height: 120px;
            }

            .logo-placeholder {
                font-size: 48px;
            }

            .welcome-btn {
                padding: 18px 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-page">
        <div class="welcome-container">
            <h1 class="welcome-title">
                Colegio <span class="welcome-title-editable" id="schoolName">Mi Colegio</span>
            </h1>

            <div class="logos-container">
                <!-- Logo Red de Colegios -->
                <div class="logo-item">
                    <div class="logo-box">
                        <div class="logo-placeholder" id="logoRed">🏫</div>
                    </div>
                    <span class="logo-label">Red de Colegios</span>
                </div>

                <!-- Logo del Colegio -->
                <div class="logo-item">
                    <div class="logo-box">
                        <div class="logo-placeholder" id="logoColegio">🎓</div>
                    </div>
                    <span class="logo-label">Nuestro Colegio</span>
                </div>

                <!-- Logo EDUGEST -->
                <div class="logo-item">
                    <div class="logo-box">
                        <img src="LOGO EDUGEST.png" alt="EDUGEST" id="logoEdugest">
                    </div>
                    <span class="logo-label">Sistema EDUGEST</span>
                </div>
            </div>

            <button class="welcome-btn" onclick="ingresarSistema()">
                🚀 Ingresar al Sistema
            </button>

            <p class="welcome-subtitle">
                Sistema de Gestión Educativa PME 2026
            </p>
        </div>
    </div>

    <script>
        // Cargar nombre del colegio desde localStorage
        const schoolName = localStorage.getItem('schoolName') || 'Mi Colegio';
        document.getElementById('schoolName').textContent = schoolName;

        // Función para ingresar al sistema
        function ingresarSistema() {
            // Verificar si el usuario está autenticado
            const userId = localStorage.getItem('userId');
            
            if (userId) {
                // Si está autenticado, ir al dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Si no está autenticado, ir al login
                window.location.href = 'index.html';
            }
        }

        // Cargar logos personalizados si existen
        window.addEventListener('DOMContentLoaded', () => {
            const logoRedUrl = localStorage.getItem('logoRedUrl');
            const logoColegioUrl = localStorage.getItem('logoColegioUrl');

            if (logoRedUrl) {
                document.getElementById('logoRed').innerHTML = `<img src="${logoRedUrl}" alt="Red">`;
            }

            if (logoColegioUrl) {
                document.getElementById('logoColegio').innerHTML = `<img src="${logoColegioUrl}" alt="Colegio">`;
            }
        });
    </script>
</body>
</html>
