<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Iniciar Sesión - EDUGEST</title>
    <link rel="stylesheet" href="css/login-modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Panel Izquierdo - Branding -->
        <div class="login-brand-panel">
            <div class="brand-content">
                <div class="brand-logo">
                    <img 
                        src="images/LOGO EDUGEST.png" 
                        srcset="images/LOGO EDUGEST.png 1x, images/LOGO EDUGEST@2x.png 2x"
                        alt="EDUGEST Logo" 
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    >
                    <div class="logo-fallback" style="display: none;">
                        <span class="logo-icon">🎓</span>
                    </div>
                </div>
                
                <h1 class="brand-title">EDUGEST</h1>
                <p class="brand-subtitle">Sistema de Gestión Educativa Inteligente</p>
                
                <div class="brand-features">
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span class="feature-text">Gestión Integral</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🎯</span>
                        <span class="feature-text">Resultados Medibles</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🚀</span>
                        <span class="feature-text">Tecnología Avanzada</span>
                    </div>
                </div>
                
                <div class="brand-decoration">
                    <div class="decoration-circle circle-1"></div>
                    <div class="decoration-circle circle-2"></div>
                    <div class="decoration-circle circle-3"></div>
                </div>
            </div>
        </div>
        
        <!-- Panel Derecho - Formulario -->
        <div class="login-form-panel">
            <div class="form-container">
                <div class="form-header">
                    <h2>Bienvenido de vuelta</h2>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="tu@correo.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-text">Recordarme</span>
                        </label>
                        
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <span class="btn-text">Iniciar Sesión</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="loader"></span>
                        </span>
                    </button>
                </form>
                
                <div class="form-footer">
                    <p>¿Necesitas ayuda? <a href="#">Contacta soporte</a></p>
                </div>
            </div>
            
            <div class="login-footer">
                <p>&copy; 2024 EDUGEST. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
    
    <script src="js/login-modern.js"></script>
</body>
</html>
